services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # Local, free LLM runtime. Pull a model after first start with:
  #   docker compose exec ollama ollama pull llama3.1
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://documind:documind@db:5432/documind
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod-please-min-32-chars}
      VECTOR_DB_PATH: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_BASE_URL: http://ollama:11434
      EMBEDDING_PROVIDER: sentence_transformers
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  pgdata:
  ollama_data:
  backend_data:
